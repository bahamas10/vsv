[package]
name = "vsv"
version = "2.0.1"
description = "Runit service manager CLI"
edition = "2021"
repository = "https://github.com/bahamas10/rust-vsv"
license = "MIT"
exclude = ["/assets"]
keywords = ["runit", "void", "void-linux"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["cargo", "derive"] }
dirs = "7.0.0"
libc = "0.2.191"
rayon = "1.12.0"
yansi = "1.0.1"

[dev-dependencies]
assert_cmd = "2.1.1"
